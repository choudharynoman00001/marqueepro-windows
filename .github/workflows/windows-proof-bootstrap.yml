name: windows-proof-bootstrap
# Manual only. Synthetic data only. No provider contact. Run once.
# Checks 1-mqproof-payload.zip (repository root) against the sha256 values pinned here, verifies EVERY entry against the manifest below in memory,
# and only then writes the approved app/ files into a NEW per-user folder (the account's Programs folder, like the real per-user install). Nothing is run from the zip before it is verified.
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Choose a new per-user proof folder
        shell: pwsh
        run: |
          $id = $env:GITHUB_RUN_ID
          if ($id -notmatch '^[0-9]{6,20}$') { Write-Host 'refused: unexpected run id'; exit 1 }
          $la = $env:LOCALAPPDATA
          if ([string]::IsNullOrWhiteSpace($la) -or -not [System.IO.Path]::IsPathRooted($la) -or -not (Test-Path -LiteralPath $la -PathType Container)) { Write-Host 'refused: per-user location not available'; exit 1 }
          $parent = Join-Path $la ('Programs\mqp-' + $id)
          if (Test-Path -LiteralPath $parent) { Write-Host 'refused: the per-user proof folder already exists (nothing was changed)'; exit 1 }
          $u = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, ('MQ_APP=' + (Join-Path $parent 'app') + "`n"), $u)
          Write-Host 'proof app folder: new folder under the per-user Programs location (Programs/mqp-<run id>/app)'
      - name: Verify the payload and extract the approved app files
        shell: pwsh
        env:
          ZIP_SHA256: 1a86b8845cf48a56cb6b1fa42242a3a52e882e9f94a9b43c58f782b9a7c24c31
          MANIFEST_SHA256: 12f4a02d62d914b6c748c81831e932a904d9de7335eaf47c2d797b04364924e8
        run: |
          $t = $env:RUNNER_TEMP
          $v = @'
          // Verifies a ZIP against a fixed manifest, entirely in memory, and only then writes the approved app/ files into a NEW folder.
          // usage: node verify-extract.cjs <zip> <expected-zip-sha256> <manifest.txt> <expected-manifest-sha256> <target-dir>
          // manifest.txt: lines of "<sha256>  <path>" (sorted). Exit 0 = extracted, 2 = refused (nothing written). Prints names and counts only.
          'use strict';
          const fs = require('fs'), path = require('path'), crypto = require('crypto'), zlib = require('zlib');
          const MAX_FILE = 1024 * 1024, MAX_TOTAL = 4 * 1024 * 1024;
          const sha = (b) => crypto.createHash('sha256').update(b).digest('hex');
          const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
          const crc32 = (b) => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
          class Refuse extends Error {}
          const no = (m) => { throw new Refuse(m); };
          function verify(zipBuf, zipSha, manifestText, manifestSha) {
            if (sha(zipBuf) !== zipSha) no('zip hash differs from the pinned hash');
            if (sha(Buffer.from(manifestText, 'utf8')) !== manifestSha) no('manifest hash differs from the pinned hash');
            const man = new Map();
            for (const line of manifestText.split('\n')) { if (!line) continue; const m = /^([0-9a-f]{64})  (\S.*)$/.exec(line); if (!m) no('bad manifest line'); if (man.has(m[2])) no('duplicate manifest path'); man.set(m[2], m[1]); }
            if (!man.size) no('empty manifest');
            const b = zipBuf; if (b.length < 22 || b.length > 16 * 1024 * 1024) no('zip size out of bounds');
            const e = b.length - 22; if (b.readUInt32LE(e) !== 0x06054b50 || b.readUInt16LE(e + 20) !== 0) no('end record not at the very end (comment or trailing data)');
            const count = b.readUInt16LE(e + 10); if (b.readUInt16LE(e + 8) !== count || b.readUInt16LE(e + 4) !== 0 || b.readUInt16LE(e + 6) !== 0) no('multi-disk or inconsistent end record');
            if (count !== man.size) no('entry count ' + count + ' differs from the manifest count ' + man.size);
            const cdSize = b.readUInt32LE(e + 12); let p = b.readUInt32LE(e + 16); if (p === 0xffffffff || p + cdSize !== e) no('central directory not where the end record says');
            const seen = new Set(), seenLower = new Set(), out = []; let total = 0;
            for (let i = 0; i < count; i++) {
              if (p + 46 > e || b.readUInt32LE(p) !== 0x02014b50) no('bad central entry');
              const made = b.readUInt16LE(p + 4), flags = b.readUInt16LE(p + 8), method = b.readUInt16LE(p + 10), crc = b.readUInt32LE(p + 16), cs = b.readUInt32LE(p + 20), us = b.readUInt32LE(p + 24);
              const nl = b.readUInt16LE(p + 28), el = b.readUInt16LE(p + 30), cl = b.readUInt16LE(p + 32), ext = b.readUInt32LE(p + 38), lo = b.readUInt32LE(p + 42);
              if (flags & 0x1 || flags & 0x40) no('encrypted entry'); if (method !== 0 && method !== 8) no('unsupported compression');
              if (cs === 0xffffffff || us === 0xffffffff || lo === 0xffffffff) no('zip64 entry'); if (us > MAX_FILE) no('entry too large'); total += us; if (total > MAX_TOTAL) no('total size too large');
              const nameBuf = b.subarray(p + 46, p + 46 + nl); const name = nameBuf.toString('utf8'); if (Buffer.from(name, 'utf8').compare(nameBuf) !== 0) no('name is not clean UTF-8');
              if (!/^[A-Za-z0-9._@-]+(\/[A-Za-z0-9._@-]+)*$/.test(name) || name.split('/').some((s) => s === '..' || s === '.' || s === '')) no('unsafe name');
              if (name.endsWith('/')) no('directory entry'); const host = made >>> 8; const mode = ext >>> 16; if (host === 3 && mode !== 0 && (mode & 0xf000) !== 0x8000) no('not a regular file: ' + name); if (ext & 0x10) no('directory attribute');
              if (seen.has(name)) no('duplicate entry'); seen.add(name); const low = name.toLowerCase(); if (seenLower.has(low)) no('case alias'); seenLower.add(low);
              if (!man.has(name)) no('entry not in the manifest: ' + name);
              p += 46 + nl + el + cl;
              if (lo + 30 > b.length || b.readUInt32LE(lo) !== 0x04034b50) no('bad local header'); const lnl = b.readUInt16LE(lo + 26), lel = b.readUInt16LE(lo + 28);
              if (b.subarray(lo + 30, lo + 30 + lnl).toString('utf8') !== name) no('local name differs from central name'); const ds = lo + 30 + lnl + lel; if (ds + cs > cdStart(b, e)) no('data overlaps the central directory');
              const raw = b.subarray(ds, ds + cs); let data; try { data = method === 0 ? Buffer.from(raw) : zlib.inflateRawSync(raw, { maxOutputLength: MAX_FILE + 1 }); } catch { no('cannot inflate ' + name); }
              if (data.length !== us || (method === 0 && cs !== us)) no('size mismatch'); if (crc32(data) !== crc) no('crc mismatch'); if (sha(data) !== man.get(name)) no('content hash differs from the manifest: ' + name);
              out.push({ name, data });
            }
            if (p !== e) no('trailing bytes in the central directory'); for (const k of man.keys()) if (!seen.has(k)) no('manifest path missing from the zip: ' + k);
            return out;
          }
          function cdStart(b, e) { return b.readUInt32LE(e + 16); }
          function extract(files, target, prefix) {
            if (fs.existsSync(target)) no('target folder already exists');
            const root = path.resolve(target); const sel = files.filter((f) => f.name.startsWith(prefix));
            for (const f of sel) { const rel = f.name.slice(prefix.length); const dst = path.resolve(root, ...rel.split('/')); if (!dst.startsWith(root + path.sep)) no('path escapes the target'); fs.mkdirSync(path.dirname(dst), { recursive: true }); fs.writeFileSync(dst, f.data, { flag: 'wx' }); }
            return sel.length;
          }
          module.exports = { verify, extract, Refuse };
          if (require.main === module) {
            try {
              const [zip, zs, man, ms, target] = process.argv.slice(2); if (!target) no('usage');
              const files = verify(fs.readFileSync(zip), zs, fs.readFileSync(man, 'utf8'), ms);
              const n = extract(files, target, 'app/'); console.log(`verified ${files.length} entries; wrote ${n} app files; the other ${files.length - n} entries were hashed and not written`);
            } catch (err) { if (err instanceof Refuse) { console.error('REFUSED: ' + err.message); process.exit(2); } console.error('ERROR: ' + (err && err.message)); process.exit(3); }
          }
          '@
          $m = @'
