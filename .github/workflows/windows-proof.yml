name: windows-proof
# Manual only. Synthetic data only. No provider contact. Run once, after the source is frozen.
# Runs from the prebuilt app/ folder only (no TypeScript source, no build step).
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node node_modules/prisma/build/index.js generate
      - run: node scripts/win-proof.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: win-proof-result, path: app/win-proof-result.json, if-no-files-found: ignore, retention-days: 3 }
